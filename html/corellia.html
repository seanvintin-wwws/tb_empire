<!DOCTYPE html>
<html lang="ennto">
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>ROTE - Corellia</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Interactive Rise of the Empire Territory Battle Map SWGoH">
	<meta name="keywords" content="swgoh, star wars, rote, territory, battle, map, tactics, interactive, tb_geo, genskaar">
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="../css/corellia.css">
	<link rel="icon" type="image" href="../media/favicon/get3.png">
<style>
.guide-src{font-size:0.8em;opacity:0.8;margin-bottom:4px}
.guide-src a{color:#8cf}
.guide-note{background:rgba(255,200,0,0.15);border-left:3px solid #fc0;padding:6px 8px;text-align:left}
.guide-table{width:100%;font-size:0.9em;border-collapse:collapse}
.guide-table td{border-top:1px solid rgba(255,255,255,0.15);padding:4px;vertical-align:top}
.guide-rate{white-space:nowrap;width:1%}
.guide-how{font-size:0.85em;color:#8cf}
.guide-notes{font-size:0.85em;opacity:0.85;font-style:italic}
</style>
</head>
<body>
<div class="wrapper">
	<div class="container-fluid ">
		<div class="row justify-content-center h-100 text-center">
			<div id="app" class="map">
                <svg viewBox="0 0 1000 667">
				</svg>
				<mission></mission>
			</div>
		</div>
	</div>
</div>
<!--Templates for Vue-->
<template id="mission">
	<div>
		<img class="mission"
		v-for="mission in missions" 
		v-bind:key="mission.name" 
		v-bind:class="mission.name"
		v-bind:src="'../media/mission_' +  mission.type + '.png'"
        @click="selectedMission = mission; seen = true"
		>
		<!--v-click-outside="hide"-->
		<div v-if="seen && selectedMission.type !== 'platoon'" class="description" v-bind:class="'desc_' + selectedMission.position">
			
            <div class="mb-3">
            <h3><i class="fa fa-window-close fa-fw topcorner" @click="hide"></i></h3>
            </div>
            
            <div class="mb-3" v-if="selectedMission.reqs">
				<p class="h4">Requirements</p>
					<div v-for="item in selectedMission.reqs">
                        <p>{{reqs[item]}}</p>
                    </div>
			</div>
            
            
			<div class="mb-3 guide" v-if="guide(selectedMission)">
				<p class="h4">Recommended teams</p>
				<p class="guide-src">Teams that win 2/2 on auto. Updated {{ guideUpdated() }} from <a href="https://swgohrote.com/" target="_blank">swgohrote.com</a>.</p>
				<p class="guide-note" v-if="guideNote(selectedMission)">{{ guideNote(selectedMission) }}</p>
				<p v-if="!guide(selectedMission).length">No team rated 2/2 on auto yet. Check <a href="https://swgohrote.com/" target="_blank">swgohrote.com</a>.</p>
				<table class="guide-table" v-if="guide(selectedMission).length">
					<tr v-for="t in guide(selectedMission)">
						<td class="text-left">
							<b>{{ t.lead }}</b>
							<span v-if="t.with"> + {{ t.with }}</span>
							<div v-if="t.how" class="guide-how">{{ t.how }}</div>
							<div v-if="t.notes" class="guide-notes">{{ t.notes }}</div>
						</td>
					</tr>
				</table>
			</div>
			<div class="mb-3" v-if="false">
				<p  class="h4">Preferred teams</p>
				<div v-for="item in selectedMission.preferredSquads">
                    <p><img v-bind:src="'../media/'+squads[item].videosource+'.png'" onerror="this.src='../media/none.png';" alt="vid" ><a :href="squads[item].video"> {{squads[item].name}}</a></p>
					<div class="img_block">
						<img 
						v-for="pic in squads[item].toons"
						v-bind:src="'../media/toons/' + pic + '.png'"
						>
					</div>
				</div>
			</div>
			
			<div class="mb-3" v-if="false">
				<p class="h4">Wave Breakdown</p>
				<ul>
					<li class="text-justify" v-for="item in selectedMission.dangerousEnemies">{{enemies[item]}}</li>
				</ul>
			</div>

			<div class="mb-3 " v-if="false">
                <p class="h4">Operation Requirements</p>
				<span v-for="item in selectedMission.preqs">&nbsp;&nbsp;{{item}}&nbsp;&nbsp;&nbsp;</span>
			    
				<p class="h4">Required toons</p>
					<div v-for="item in selectedMission.requiredToons" class="row justify-content-center .flex-nowrap">
							<div class="platoons" v-for="item in platoons[item]">{{item}}</div>
					</div>
					
				<p class="h4"> Affected Territories </p>
				  
					  <ul>
					<li class="text-justify" v-for="item in selectedMission.platzones">{{platims[item]}}</li>
				     </ul>
					  <div>
				      <img src="../media/platoons/corellia.png" style="width:512px;height:256px;">
				      </div>
				   
			</div>
			
			<div class="mb-3" v-if="false">
				<p class="h4">Important Modifiers</p>
				<ul>
					<li class="text-justify" v-for="item in selectedMission.modifiers">{{modifiers[item]}}</li>
				</ul>
			</div>
            <div class="mb-3" v-if="selectedMission.notes">
				<p class="h4">Notes</p>
				<ul>
					<li class="text-justify" v-for="item in selectedMission.notes">{{notes[item]}}</li>
				</ul>
			</div>


			<div class="rewards mb-3" v-if="false">
				<p class="h4">Rewards</p>
				<span v-for="item in selectedMission.rewards">&nbsp;&nbsp;{{item}}&nbsp;&nbsp;&nbsp;</span>
			</div>
            
            <div class="rewards mb-3" v-if="selectedMission.stars">
                                <h2>Corellia</h2>
				<p class="h4">Star Requirements</p>
                <ul>
				    <li class="text-justify" v-for="item in selectedMission.stars">{{item}}</li>
                </ul>
			</div>
		</div>
	</div>
</template>
<div class="top-left"><a href="main.html" style="color:#FFFFFF;"> <i class="fa fa-home fa-fw"></i>Full Map </a><br>
<script src="../js/vue.min.js"></script>
<script>window.GUIDE_PLANET = "corellia";</script>
<script src="../js/guide_data.js"></script>
<script src="../js/corellia.js"></script>

</body>
</html>
